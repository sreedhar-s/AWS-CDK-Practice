name: CDK Bootstrap

on:
  workflow_dispatch:
    inputs:
      account_id:
        description: "AWS account ID to bootstrap"
        required: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1

jobs:
  bootstrap:
    name: Bootstrap ${{ inputs.account_id }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ inputs.account_id }}:role/gha-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-bootstrap

      - name: CDK bootstrap
        run: uv run cdk bootstrap aws://${{ inputs.account_id }}/${{ env.AWS_REGION }}