name: CDK Bootstrap

on:
  workflow_dispatch:
    inputs:
      account_id:
        description: "AWS account ID to bootstrap"
        required: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1

jobs:
  bootstrap:
    name: Bootstrap ${{ inputs.account_id }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      # - name: Check GitHub environment
      #   run: |
      #     echo "Repository: $GITHUB_REPOSITORY"
      #     echo "Ref: $GITHUB_REF"
      #     echo "Event: $GITHUB_EVENT_NAME"

      # - name: Debug OIDC claims
      #   shell: bash
      #   run: |
      #     TOKEN=$(curl -sSf \
      #       -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
      #       "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
      #       | jq -r '.value')

      #     echo "$TOKEN" | cut -d '.' -f2 | base64 -d 2>/dev/null | jq '{
      #       iss,
      #       sub,
      #       aud,
      #       repository,
      #       repository_owner,
      #       ref,
      #       event_name
      #     }'
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ inputs.account_id }}:role/gha-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-bootstrap
          audience: sts.amazonaws.com

      - name: CDK bootstrap
        run: uv run cdk bootstrap aws://${{ inputs.account_id }}/${{ env.AWS_REGION }} --trust ${{ inputs.account_id}} --cloudformation-execution-policies arn:aws:iam::aws:policy/AdministratorAccess