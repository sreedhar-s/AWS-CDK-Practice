name: CDK Deploy

on:
  workflow_dispatch:
    inputs:
      stack:
        description: "Which stack(s) to deploy (space-separated)"
        required: true
      account_id:
        description: "AWS account ID to deploy"
        required: true

permissions:
  id-token: write 
  contents: read 

env:
  AWS_REGION: ap-southeast-1

jobs:
  cdk-plan:
    name: cdk plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d 

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{inputs.account_id}}:role/gha-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy
          audience: sts.amazonaws.com

      - name: CDK synth
        env:
          STACKS: ${{ inputs.stack }}
        run: uv run cdk synth $STACKS

      - name: CDK diff (shown in run summary for the approver)
        env:
          STACKS: ${{ inputs.stack }}
        run: |
          {
            echo '## CDK diff'
            echo '```'
            uv run cdk diff $STACKS 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      
      - name: Upload cloud assembly
        uses: actions/upload-artifact@v4
        with:
          name: cdk-out
          path: cdk.out
          retention-days: 1

  cdk-deploy:
    name: cdk deploy
    needs: cdk-plan
    runs-on: ubuntu-latest
    environment: approval

    steps:
      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: Download cloud assembly
        uses: actions/download-artifact@v4
        with:
          name: cdk-out
          path: cdk.out
 
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ inputs.account_id }}:role/gha-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy
          audience: sts.amazonaws.com
 
      - name: CDK deploy
        env:
          STACKS: ${{ inputs.stack }}
        run: cdk deploy --app cdk.out $STACKS --require-approval never
